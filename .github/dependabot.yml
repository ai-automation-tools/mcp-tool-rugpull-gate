# Dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem per week;
# npm majors are ignored: the biweekly upstream check flags a major that breaks something
# (TypeScript 7 in particular, see docs/UPSTREAMS.md), and Dependabot security alerts still
# fire for any version.
# Semantic upstream drift (the MCP tools/list shape, annotation defaults, the agent inventory
# schema) is the mcp-tool-rugpull-gate-upstream routine's job -- see docs/UPSTREAMS.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
